[project]
name = "enterprise-agentops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hitesh", email = "mukadder@bu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[project.scripts]
enterprise-agentops = "enterprise_agentops:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
