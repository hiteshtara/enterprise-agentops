[project]
name = "enterprise-agentops"
version = "0.1.0"
description = "Enterprise AgentOps: a governed LLM agent runtime with risk-tiered tools, human approval, and audit logging."
readme = "README.md"
authors = [
    { name = "hitesh", email = "mukadder@bu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

# This is a deployable application, not a distributable library, so uv installs
# the dependencies without building the project itself.
[tool.uv]
package = false

# FastAPI's dependency-injection idiom puts Depends()/Query() calls in argument
# defaults, which bugbear's B008 flags by default. These calls are safe there.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
