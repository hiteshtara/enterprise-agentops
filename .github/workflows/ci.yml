# The gates that were being run by hand.
#
# This exists because the pricing write path is safe by virtue of its tests --
# guardrails, kill switches, staleness refusal and write-outcome handling are
# all held in place by assertions rather than by convention. Until this
# workflow existed, nothing on GitHub could stop a pull request merging with
# those assertions red.
#
# Keep it minimal and keep it fast. It runs exactly what a contributor runs
# locally, so a green check here means the same thing as a green terminal.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref; main is never
# cancelled, so its history of results stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `test` is already `vitest run`, so this does not watch.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
